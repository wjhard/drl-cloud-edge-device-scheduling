[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drl-cloud-edge-device-scheduling"
version = "0.1.0"
description = "DAG scheduling for heterogeneous cloud, edge, and device resources"
requires-python = ">=3.10,<3.13"
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["scheduler_interface"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
env = ["normalization_stats.json"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
